<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>授权中心</title>
    <link rel="stylesheet" href="./portal.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%91%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- ============ 顶栏 ============ -->
    <header class="pt-header">
      <div class="pt-brand">
        <span class="logo-tile" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 9.5a3.5 3.5 0 1 1-3.4-3.5" />
            <path d="M12 3.5 20 11.5l-2.2 2.2-1.6-1.6-1.5 1.5-1.6-1.6-1.5 1.5-2.1-2.1" />
          </svg>
        </span>
        <div class="pt-brand-text">
          <strong>授权中心</strong>
          <span class="muted small">注册 · 授权查询 · 激活</span>
        </div>
      </div>
      <div class="pt-header-right" id="header-right"></div>
    </header>

    <main class="pt-main">
      <!-- 未登录：登录 / 注册 + 查卡 -->
      <section id="view-auth" hidden>
        <div class="auth-stack">
          <div class="auth-shell">
            <aside class="auth-hero">
              <h1>一个账号，管好你买过的所有授权</h1>
              <p class="auth-sub">登录后可以看到每个软件到期时间、开通了哪些模块、用了几台设备。</p>
              <ul class="auth-points">
                <li><i>1</i>输入激活码，立刻知道是什么产品、多少天、几台设备</li>
                <li><i>2</i>授权到期、模块是否可用，一屏看全</li>
                <li><i>3</i>换电脑不用问客服，自己就能看设备占用</li>
              </ul>
            </aside>

            <div class="auth-card">
              <div class="auth-tabs" role="tablist">
                <button class="auth-tab active" data-auth-tab="login" type="button">登录</button>
                <button class="auth-tab" data-auth-tab="register" type="button">注册</button>
              </div>

              <form id="form-login" class="auth-form" autocomplete="on">
                <label class="field">
                  <span>邮箱</span>
                  <input id="login-email" type="email" inputmode="email" autocomplete="username" required placeholder="you@example.com" />
                </label>
                <label class="field">
                  <span>密码</span>
                  <input id="login-password" type="password" autocomplete="current-password" required placeholder="至少 8 位" />
                </label>
                <p class="form-error" id="login-error" hidden></p>
                <button class="btn btn-primary btn-block" type="submit">登录</button>
              </form>

              <form id="form-register" class="auth-form" autocomplete="on" hidden>
                <label class="field">
                  <span>邮箱</span>
                  <input id="reg-email" type="email" inputmode="email" autocomplete="username" required placeholder="you@example.com" />
                </label>
                <label class="field">
                  <span>密码</span>
                  <input id="reg-password" type="password" autocomplete="new-password" required minlength="8" placeholder="至少 8 位" />
                </label>
                <label class="field">
                  <span>姓名 / 称呼</span>
                  <input id="reg-name" type="text" autocomplete="name" placeholder="选填，方便对账" maxlength="40" />
                </label>
                <p class="form-error" id="reg-error" hidden></p>
                <button class="btn btn-primary btn-block" type="submit">注册并登录</button>
              </form>
            </div>
          </div>

          <!-- 未登录也能查卡，不核销 -->
          <section class="inspect-card">
            <div class="inspect-head">
              <h3>查询激活码</h3>
              <span class="muted small">不用登录：看看是什么产品、多少天、几台设备</span>
            </div>
            <div class="act-row">
              <input
                id="guest-cdk"
                placeholder="XXXX-XXXX-XXXX-XXXX"
                autocomplete="off"
                spellcheck="false"
                maxlength="32"
                aria-label="激活码"
              />
              <button class="btn btn-primary" id="guest-inspect" type="button">查询</button>
            </div>
            <div id="guest-result"></div>
          </section>
        </div>
      </section>

      <!-- 登录后 -->
      <section id="view-app" hidden>
        <nav class="pt-tabs">
          <button class="pt-tab active" data-tab="licenses" type="button">我的授权</button>
          <button class="pt-tab" data-tab="activate" type="button">激活新卡</button>
        </nav>

        <div id="pane-licenses" class="pt-pane"></div>
        <div id="pane-activate" class="pt-pane" hidden></div>
      </section>
    </main>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>

    <script src="./portal.js" type="module"></script>
  </body>
</html>
