# 构建并推送镜像到 GitHub Container Registry（GHCR）
#
# 触发方式：
#   1) 打 tag:  git tag v1.0.0 && git push origin v1.0.0
#   2) 手动:    Actions 页面 → publish-image → Run workflow
#
# 不需要配置任何 Secret —— 使用内置 GITHUB_TOKEN（已在下方的 permissions 里声明 packages: write）
#
# 产物：
#   ghcr.io/aq25-c/la_shouquan:<版本>        例如 1.0.0
#   ghcr.io/aq25-c/la_shouquan:sha-abc1234
#
# 可选 Variable：BUILD_PLATFORMS（默认 linux/amd64；ARM 服务器改成 linux/amd64,linux/arm64）

name: publish-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  PLATFORMS: ${{ vars.BUILD_PLATFORMS || 'linux/amd64' }}

jobs:
  # 先跑端到端测试，不通过就不出镜像
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 端到端测试（零依赖，无需 npm install）
        run: npm test

  publish:
    name: 构建并推送
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本标签
        id: meta
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA:0:7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "将推送 ${REGISTRY}/${IMAGE}:${VERSION}"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          # latest 始终指向最近一次构建，服务器 `docker compose pull` 即可拿到最新；
          # 需要固定版本时在服务器 .env 里设 IMAGE_TAG=<版本号>（见 docker-compose.yml）
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出部署命令
        run: |
          echo "已推送："
          echo "  ${REGISTRY}/${IMAGE}:${{ steps.meta.outputs.version }}"
          echo "  ${REGISTRY}/${IMAGE}:${{ steps.meta.outputs.sha }}"
          echo ""
          echo "服务器上执行："
          echo "  docker pull ${REGISTRY}/${IMAGE}:${{ steps.meta.outputs.version }}"
          echo "  docker compose pull && docker compose up -d"
          echo ""
          echo "如果镜像被设为私有，拉取前先登录（PAT 需 read:packages 权限）："
          echo "  echo <你的GitHub-PAT> | docker login ghcr.io -u ${{ github.actor }} --password-stdin"
